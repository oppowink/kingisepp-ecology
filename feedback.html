<!doctype html>
<!-- feedback.html - Форма обратной связи с проектом -->
<html lang="ru">
<head>
<meta charset="utf-8"/>

<meta content="Фирменный лист проекта ЭкоБиоМониторинг" property="og:image:alt"/>

<!-- Open Graph расширенный -->
<meta property="og:title" content="Обратная связь — ЭкоБиоМониторинг" />
<meta property="og:description" content="Задайте вопрос, сообщите об ошибке или предложите улучшение проекта." />
<meta property="og:image" content="https://oppowink.github.io/kingisepp-ecology/img/brand/og-image.jpg" />
<meta property="og:url" content="https://oppowink.github.io/kingisepp-ecology/feedback.html" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="ru_RU" />

<title>Обратная связь - ЭкоБиоМониторинг</title>

<!-- фавиконка -->
<link href="img/favicon.ico" rel="icon"/>

<!-- стили -->
<link href="css/variables.css" rel="stylesheet"/>
<link href="css/components.css" rel="stylesheet"/>
<link href="css/feedback.css" rel="stylesheet"/>

<!-- тема — подключаем до body чтобы не мигало -->
<script src="js/theme.js"></script>
</head>
<body>
<!-- свечение за курсором -->
<div aria-hidden="true" class="kursor" data-component="kursor"></div>

<!-- затемнение под панель настроек -->
<div aria-hidden="true" class="nastroiki-fon" id="nastroikiFon"></div>

<!-- шапка -->
<header class="shapka" data-component="shapka">
<a aria-label="ЭкоБиоМониторинг, на главную" class="shapka-logo" href="index.html">
<span class="shapka-logo__nazvanie">
<span class="shapka-logo__bukva">Э</span><span class="shapka-logo__bukva">к</span>
<img alt="" aria-hidden="true" class="shapka-logo__list shapka-logo__list--1" src="img/leaf1.png"/>
<span class="shapka-logo__bukva">Б</span><span class="shapka-logo__bukva">и</span>
<img alt="" aria-hidden="true" class="shapka-logo__list shapka-logo__list--2" src="img/leaf2.png"/>
<span class="shapka-logo__bukva">М</span><span class="shapka-logo__bukva">о</span><span class="shapka-logo__bukva">н</span>
<span class="shapka-logo__bukva">и</span><span class="shapka-logo__bukva">т</span><span class="shapka-logo__bukva">о</span>
<span class="shapka-logo__bukva">р</span><span class="shapka-logo__bukva">и</span><span class="shapka-logo__bukva">н</span><span class="shapka-logo__bukva">г</span>
</span>
</a>
<!-- кнопки шапки -->
<div class="shapka-deystviya">
<a class="shapka-ssylka" href="account.html">
<img alt="" aria-hidden="true" class="shapka-ssylka__ikona" src="img/icons/user.png"/>
<span>Личный кабинет</span>
</a>
<button aria-controls="nastroikiPanel" aria-expanded="false" aria-label="Открыть настройки" class="nastroiki-knopka" id="nastroikiKnopka" type="button">
<img alt="" aria-hidden="true" class="nastroiki-knopka__ikona" src="img/icons/gear.png"/>
<span class="nastroiki-knopka__tekst">Настройки</span>
</button>
</div>
</header>

<!-- панель настроек -->
<aside aria-hidden="true" aria-label="Настройки" class="nastroiki-panel" id="nastroikiPanel">
<button aria-label="Закрыть настройки" class="nastroiki-zakryt" id="nastroikiZakryt" type="button">
<img alt="" aria-hidden="true" src="img/icons/close.png"/>
<span class="sr-only">Закрыть</span>
</button>
<!-- переключатель темы -->
<div class="tema-vybor-blok">
<p class="tema-podpis">Тема</p>
<div class="tema-vybor">
<button class="tema-knopka" id="temaSvetlaya" type="button">
<img alt="" aria-hidden="true" src="img/icons/sun.png"/><span>Светлая</span>
</button>
<button class="tema-knopka" id="temaTemnaya" type="button">
<img alt="" aria-hidden="true" src="img/icons/moon.png"/><span>Тёмная</span>
</button>
</div>
</div>
<!-- ссылка на личный кабинет -->
<div class="nastroiki-akkaunt">
<a class="nastroiki-ssylka nastroiki-ssylka--akcent" href="account.html">
<img alt="" aria-hidden="true" src="img/icons/user.png"/><span>Личный кабинет</span>
</a>
</div>
<!-- навигация -->
<nav aria-label="Навигация" class="nastroiki-navigaciya">
<a class="nastroiki-ssylka" href="index.html">Главная</a>
<a class="nastroiki-ssylka" href="map.html">Карта</a>
<a class="nastroiki-ssylka" href="faq.html">Вопросы и ответы</a>
<a class="nastroiki-ssylka" href="games.html">Игры</a>
<a class="nastroiki-ssylka" href="about.html">О проекте и авторе</a>
<a class="nastroiki-ssylka" href="feedback.html">Обратная связь</a>
</nav>
</aside>

<!-- основной контент -->
<main class="obratnaya-svyaz vnutrennyaya-stranica">
<!-- заголовок с иконкой -->
<div class="obratnaya-svyaz__zagolovok">
<img alt="" aria-hidden="true" class="obratnaya-svyaz__ikona" src="img/icons/soobshchenie.png"/>
<h1>Обратная связь</h1>
</div>

<!-- форма обратной связи -->
<form class="forma-obratnoy-svyazi" id="formaObratnoySvyazi">
<!-- поле Имя -->
<div class="pole-gruppa">
<label class="pole-podpis" for="svyazImya">Имя</label>
<input autocomplete="name" class="pole-vvod" id="svyazImya"/>
</div>
<!-- поле Email -->
<div class="pole-gruppa">
<label class="pole-podpis" for="svyazEmail">E-mail</label>
<input autocomplete="email" class="pole-vvod" id="svyazEmail" type="email"/>
</div>
<!-- выпадающий список темы -->
<div class="pole-gruppa">
<span class="pole-podpis" id="svyazTipLabel">Тема</span>
<input id="svyazTip" type="hidden" value="idea"/>
<div class="vybor-temy" id="vyborTemy">
<button aria-controls="vyborTemySpisok" aria-expanded="false" aria-haspopup="listbox" aria-labelledby="svyazTipLabel vyborTemyTekst" class="vybor-temy__knopka" id="vyborTemyKnopka" type="button">
<span id="vyborTemyTekst">Предложение</span>
<span aria-hidden="true" class="vybor-temy__strelka"></span>
</button>
<div aria-label="Тема сообщения" class="vybor-temy__spisok" hidden="" id="vyborTemySpisok" role="listbox">
<button aria-selected="true" class="vybor-temy__punkt aktivny" data-value="idea" role="option" type="button">Предложение</button>
<button aria-selected="false" class="vybor-temy__punkt" data-value="problem" role="option" type="button">Проблема</button>
<button aria-selected="false" class="vybor-temy__punkt" data-value="question" role="option" type="button">Вопрос</button>
</div>
</div>
</div>
<!-- текстовое поле сообщения -->
<div class="pole-gruppa">
<label class="pole-podpis" for="svyazTekst">Сообщение</label>
<textarea class="pole-tekst" id="svyazTekst" required=""></textarea>
</div>
<!-- сообщение об ошибке/успехе -->
<p class="soobshchenie" hidden="" id="svyazSoobshchenie"></p>
<!-- кнопка отправки -->
<button class="knopka-osnovnaya" type="submit">Отправить</button>
</form>
</main>

<!-- подвал -->
<footer aria-label="Подвал сайта" class="podval" data-component="podval">
<div class="podval-vnutri">
<span class="podval-nazvanie">ЭкоБиоМониторинг</span>
<span>Кингисепп</span>
<span>2025-2026</span>
</div>
</footer>

<!-- скрипты -->
<!-- Supabase нужен только для формы обратной связи; ключ должен быть anon/publishable, не service role -->
<script>
window.ECO_SUPABASE_URL = window.ECO_SUPABASE_URL || '';
window.ECO_SUPABASE_ANON_KEY = window.ECO_SUPABASE_ANON_KEY || '';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script defer src="js/header.js"></script>
<script defer src="js/cursor.js"></script>
<script defer src="js/feedback.js"></script>
</body>
</html>
