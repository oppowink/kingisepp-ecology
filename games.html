<!doctype html>
<!-- games.html — автономная игровая страница; аккаунты и сервер не используются. -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Собирайте листья, сортируйте образцы и разбирайте учебные заявки в трёх мини-играх ЭкоБиоМониторинга.">
  <title>Экологический детектив | ЭкоБиоМониторинг</title>
  <link rel="icon" href="img/favicon.ico">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/games.css">
  <script src="js/games.js" defer></script>
</head>
<body class="arcade">
  <!-- Компактная шапка сохраняет место для игры даже на телефоне. -->
  <header class="arcade-header">
    <a class="arcade-brand" href="index.html">ЭкоБиоМониторинг</a>
    <nav class="arcade-nav" aria-label="Навигация игр">
      <a href="index.html">На главную</a>
      <a class="account-link" href="account.html">Личный кабинет</a>
      <button id="themeToggle" class="text-button" type="button" aria-pressed="false">Тёмная тема</button>
    </nav>
  </header>
  <main class="arcade-main" id="arcadeMain">
    <header class="session-header">
      <div class="session-heading">
        <p class="eyebrow" id="sessionLabel">Три мини-игры</p>
        <h1 id="sessionTitle" tabindex="-1">Экологический детектив</h1>
      </div>
      <button type="button" class="button" id="finishGame" hidden>Завершить</button>
    </header>
    <div id="gameStage" class="game-stage"></div>
    <noscript>Для игр нужен JavaScript. Включите его в браузере и обновите страницу.</noscript>
    <p class="game-notice" id="gameNotice" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
</body>
</html>
